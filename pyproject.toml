[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reqstorm"
dynamic = ["version"]
description = "Send thousands of HTTP requests from Python or the command line, with per-host rate limits, retries, pagination, progress and logs, and results written to files or databases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Melih Colpan", email = "colpanmelih@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9,<4"]
keywords = ["http", "http-client", "asyncio", "aiohttp", "bulk-requests", "batch", "concurrency", "rate-limit",
            "retry", "backoff", "pagination", "api-client", "cli", "socks", "jsonl", "sqlite", "postgresql"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
socks = ["aiohttp-socks>=0.10"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "trustme>=1.1", "pydantic>=2", "aiohttp-socks>=0.10"]
lint = ["ruff>=0.6", "mypy>=1.10", "pydantic>=2", "aiohttp-socks>=0.10"]

[project.scripts]
reqstorm = "reqstorm._cli:main"

[project.urls]
Homepage = "https://reqstorm.github.io"
Documentation = "https://reqstorm.github.io"
Source = "https://github.com/melihcolpan/reqstorm"
Changelog = "https://github.com/melihcolpan/reqstorm/blob/master/CHANGELOG.md"
Issues = "https://github.com/melihcolpan/reqstorm/issues"

[tool.setuptools]
packages = ["reqstorm"]

[tool.setuptools.dynamic]
version = { attr = "reqstorm.__version__" }

[tool.setuptools.package-data]
reqstorm = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # On Python 3.9, pytest-asyncio creates an event loop through asyncio.get_event_loop()
    # after a test has used asyncio.run() (the blocking API does) and never closes it.
    "ignore:unclosed event loop:ResourceWarning",
]

[tool.ruff]
line-length = 110
target-version = "py39"
# Code samples in the docs and README are aligned by hand for reading
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
# Optional[...] / List[...] are kept for Python 3.9 support
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
