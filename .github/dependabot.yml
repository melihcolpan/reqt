version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # reqstorm is a library: keep the dependency ranges wide and only widen them when a
    # new release falls outside, instead of raising the minimum to the latest version.
    versioning-strategy: increase-if-necessary
