name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  databases:
    name: PostgreSQL and MySQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway database inside the CI job: no password needed
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: reqstorm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: reqstorm
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping --silent" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      REQSTORM_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres dbname=reqstorm
      REQSTORM_TEST_MYSQL: "127.0.0.1:3306:root::reqstorm"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]" "psycopg[binary]" pymysql
      - run: python -m pytest -q tests/test_ordered_and_db.py tests/test_schema_db.py -rs

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[lint]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy reqstorm

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e . -r docs/requirements.txt
      - run: mkdocs build --strict

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m build compat/reqt --outdir dist
      - run: python -m twine check --strict dist/*
      - name: The reqt package installs and re-exports reqstorm
        run: |
          python -m venv /tmp/compat
          /tmp/compat/bin/pip install --find-links dist dist/reqt-*.whl
          /tmp/compat/bin/python -W error::UserWarning -c "import reqt, reqstorm; assert reqt.fetch_all is reqstorm.fetch_all"
