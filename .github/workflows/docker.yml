name: Docker image

# Builds the reqstorm command into ghcr.io/melihcolpan/reqstorm for linux/amd64 and
# linux/arm64 when a vX.Y.Z release is published, tagged X.Y.Z, X.Y and latest.
# Run it by hand with a tag to (re)build the image of an earlier release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v2.4.1"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The Dockerfile comes from this workflow's branch, the package from the release tag,
      # so images of releases made before the Dockerfile existed can be built too.
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          path: release
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist release
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reqstorm
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - name: Build and test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: reqstorm:test
      - name: Check the image
        run: |
          docker run --rm reqstorm:test --version | grep "${TAG#v}"
          echo "http://127.0.0.1:9/" | docker run --rm -i reqstorm:test -q --timeout 2 || test $? -eq 1
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
