name: Publish

# Publishes to PyPI when a GitHub release is published, using PyPI trusted publishing
# (no API token is stored anywhere):
#   tag vX.Y.Z       -> the reqstorm package
#   tag reqt-vX.Y.Z  -> the reqt compatibility package in compat/reqt
# Both PyPI projects trust: owner melihcolpan, repository reqstorm,
# workflow publish.yml, environment pypi.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.target.outputs.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Choose the package from the tag
        id: target
        run: |
          case "$GITHUB_REF_NAME" in
            reqt-v*) echo "project=reqt" >> "$GITHUB_OUTPUT"; echo "dir=compat/reqt" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#reqt-v}" >> "$GITHUB_OUTPUT" ;;
            v*) echo "project=reqstorm" >> "$GITHUB_OUTPUT"; echo "dir=." >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::tag $GITHUB_REF_NAME must look like vX.Y.Z or reqt-vX.Y.Z"; exit 1 ;;
          esac
      - run: python -m pip install build twine
      - run: python -m build ${{ steps.target.outputs.dir }} --outdir dist
      - run: python -m twine check --strict dist/*
      - name: Check that the tag matches the package version
        run: |
          ls dist/*-${{ steps.target.outputs.version }}-py3-none-any.whl > /dev/null || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match the version of the built package"; ls dist; exit 1; }
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.project }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
